  The app icon of the build with Blink: the one of icon.svg, with a segment
  of the Chromium logo in the lower right corner. Opaque, as the App Store
  requires.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.55" stop-color="#5B4CF0"/>
      <stop offset="1" stop-color="#9B3FE0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globe">
      <circle cx="512" cy="400" r="232"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Globe -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round">
    <circle cx="512" cy="400" r="232"/>
    <g clip-path="url(#globe)">
      <ellipse cx="512" cy="400" rx="104" ry="232"/>
      <line x1="512" y1="168" x2="512" y2="632"/>
      <line x1="280" y1="400" x2="744" y2="400"/>
      <path d="M 300 290 Q 512 340 724 290"/>
      <path d="M 300 510 Q 512 460 724 510"/>
    </g>
  </g>

  <!-- AI sparkle, with a ring of background color that sets it off the globe -->
  <g transform="translate(728 196)">
    <path d="M 0 -118 C 14 -40 40 -14 118 0 C 40 14 14 40 0 118 C -14 40 -40 14 -118 0 C -40 -14 -14 -40 0 -118 Z"
          fill="#FFFFFF" stroke="#4F55F2" stroke-width="22" stroke-linejoin="round" paint-order="stroke"/>
    <path d="M 128 -96 C 133 -70 142 -61 168 -56 C 142 -51 133 -42 128 -16 C 123 -42 114 -51 88 -56 C 114 -61 123 -70 128 -96 Z"
          fill="#FFFFFF"/>
  </g>


  <!-- A segment of the Chromium logo in the lower right corner, for the
       build with Blink. The rounded corner of the app icon cuts it off. -->
  <g transform="translate(650.0 850.0) scale(1.5625)"><path d="M128 191.995c35.346 0 64-28.654 64-64 0-35.347-28.654-64-64-64-35.346 0-64 28.654-64 64 0 35.346 28.654 64 64 64Z" fill="#fff"/><path d="M96.01 183.41a63.681 63.681 0 0 1-23.42-23.43l-.007.004-55.425-96a128.027 128.027 0 0 0 110.841 192.018l55.436-96.018a63.985 63.985 0 0 1-16.465 18.775 64.007 64.007 0 0 1-70.96 4.651Z" fill="#669DF6"/><path d="M191.991 127.984a63.683 63.683 0 0 1-8.581 31.996l.007.004-55.426 96a128.029 128.029 0 0 0 110.872-192H127.991a64 64 0 0 1 64 64Z" fill="#AECBFA"/><path d="M128 180c28.719 0 52-23.281 52-52s-23.281-52-52-52-52 23.281-52 52 23.281 52 52 52Z" fill="#1A73E8"/><path d="M95.99 72.59a63.684 63.684 0 0 1 32.001-8.566v-.008h110.851A128.035 128.035 0 0 0 127.991.026 128.028 128.028 0 0 0 17.13 63.999l55.436 96.018a64.003 64.003 0 0 1 4.65-70.961A64 64 0 0 1 95.991 72.59Z" fill="#1967D2"/></g>
  <text x="512" y="842" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="134" letter-spacing="-2"
        fill="#FFFFFF">Built-In AI</text>
</svg>
