#
# Publishes the GitHub Pages site from `main`: the test pages, the privacy
# policy, the AltStore sources, and the AltStore PAL package, which
# `ios-tools/assemble_site.py` takes from its GitHub release. The release
# workflow starts this one after it updates a source, since its own pushes
# start no workflows.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ios-tools/assemble_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
